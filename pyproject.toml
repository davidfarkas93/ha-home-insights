[project]
name = "ha-home-insights"
version = "0.11.0"
description = "Persistent observations and daily facts for Home Assistant"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "gazetteer-matcher==1.1.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.27",
  "homeassistant==2026.11.1",
  "pytest>=9.0",
  "pytest-asyncio>=1.2",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
